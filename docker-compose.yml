version: '3.8'

services:
  # Shared MongoDB Database container
  mongodb:
    image: mongo:6.0
    container_name: teamtask-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # RabbitMQ Message Broker container with Management UI
  rabbitmq:
    image: rabbitmq:3-management
    container_name: teamtask-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP protocol port
      - "15672:15672"   # RabbitMQ management dashboard port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # Task Microservice (Personne 2)
  task-service:
    build: ./task-service
    container_name: teamtask-task-service
    restart: always
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/teamtask-tasks
      - RABBITMQ_URL=amqp://rabbitmq
      - PROJECT_SERVICE_URL=http://project-service:5001
      - JWT_SECRET=teamtask-secret-key
    depends_on:
      - mongodb
      - rabbitmq

  # History Microservice (Personne 2)
  history-service:
    build: ./history-service
    container_name: teamtask-history-service
    restart: always
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://mongodb:27017/teamtask-history
      - RABBITMQ_URL=amqp://rabbitmq
      - JWT_SECRET=teamtask-secret-key
    depends_on:
      - mongodb
      - rabbitmq

volumes:
  mongo-data:
  rabbitmq-data:
