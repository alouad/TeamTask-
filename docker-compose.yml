services:
  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamtask_network

  # RabbitMQ - Message broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    healthcheck:
      test: rabbitmq-diagnostics ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamtask_network

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      PORT: 3001
      JWT_SECRET: your_secret_key_change_in_production
      MONGO_URI: mongodb://mongodb:27017/teamtask
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - teamtask_network
    restart: on-failure

  # Project Service
  project-service:
    build:
      context: ./project-service
      dockerfile: Dockerfile
    container_name: project-service
    environment:
      PORT: 3002
      JWT_SECRET: your_secret_key_change_in_production
      MONGO_URI: mongodb://mongodb:27017/teamtask
      NODE_ENV: production
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
      - auth-service
      - rabbitmq
    networks:
      - teamtask_network
    restart: on-failure

  # Task Service
  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: task-service
    environment:
      PORT: 3003
      JWT_SECRET: your_secret_key_change_in_production
      MONGO_URI: mongodb://mongodb:27017/teamtask
      NODE_ENV: production
      PROJECT_SERVICE_URL: http://project-service:3002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      - mongodb
      - project-service
      - rabbitmq
    networks:
      - teamtask_network
    restart: on-failure

  # History Service
  history-service:
    build:
      context: ./history-service
      dockerfile: Dockerfile
    container_name: history-service
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongodb:27017/teamtask
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3004:3004"
    depends_on:
      - mongodb
      - task-service
      - rabbitmq
    networks:
      - teamtask_network
    restart: on-failure

networks:
  teamtask_network:
    driver: bridge

volumes:
  mongodb_data:
